name: ymzz local acceptance harness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exact upstream package manager and frozen dependencies
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile
      - name: Product security and unchanged packaging guards
        run: |
          node --test packages/ymzz/product/tests/*.test.mjs
          corepack pnpm exec tsx --test ymzz/packaging/tests/*.test.mjs
          python ymzz/packaging/tests/test_source_materials.py
          node ymzz/scripts/check-product-source.mjs
          node ymzz/scripts/check-site.mjs
      - name: Complete official eight-gate artifact build
        run: corepack pnpm run build:artifacts
      - name: Actual private product tarball assets and isolated HTTP serving
        run: |
          mkdir -p ymzz/.build/private-product-pack
          corepack pnpm --dir packages/ymzz/product pack --pack-destination ../../../ymzz/.build/private-product-pack
          node ymzz/scripts/qualify-product-assets.mjs --tarball ymzz/.build/private-product-pack/ymzz-dsh-product-0.1.0.tgz --output ymzz/.build/harness-evidence/product-assets.json
      - name: Native task context integration against built workspace packages
        run: node --test packages/ymzz/product/tests/integration/*.test.mjs
      - name: Real DSH approvals, tests, acceptance, fresh memory and offline capsule
        run: python ymzz/scripts/test-harness-local.py --port 3092 --output ymzz/.build/harness-evidence/actual-http.json
      - name: Public synthetic test evidence only (no profile, launch token or raw logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ymzz-harness-evidence-${{ github.sha }}
          path: ymzz/.build/harness-evidence/*.json
          if-no-files-found: warn
