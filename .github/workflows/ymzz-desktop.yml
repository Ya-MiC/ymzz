# MIT. 湛箴_ymzz desktop installers — the FORK'S OWN upstream chain.
#
# Why this replaced the Tauri pipeline: this repository IS the DSH fork, and its
# apps/desktop Electron chain already (1) packs workspace packages including
# @ymzz/dsh-product into the runtime, (2) boots the desktop profile with the
# upstream host that initializes the session roster (the raw `bin.js web` launch
# missed that and failed on real machines), and (3) emits 湛箴_ymzz-<version>-
# <os>-<arch> installers. The Tauri shell re-implemented all three and failed on
# the third; it is kept in desktop/ as a paused experiment, not a delivery path.
#
# Deliberately NO third-party release actions and NO caches: releases are cut
# with the gh CLI so the supply chain stays pinned to checkout/gh only.
name: ymzz desktop installers (upstream chain)
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ymzz-desktop-electron
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            script: package:win:x64:unsigned
          - os: macos-15
            target: mac-arm64
            script: package:mac:arm64:unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Stage ymzz notice payloads (electron-builder packs ymzz/.build/licenses as extraResources)
        run: node ymzz/scripts/stage-notices.mjs
      - name: Generate .env.windows for the unsigned canary (gitignored; generated per run, never committed)
        if: matrix.target == 'win-x64'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<EOF
          DSH_DESKTOP_APP_ID=io.github.ya-mic.ymzz
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=
          DOWNLOAD_TEST_RELEASE_ID=$(printf '%s' "${TAG:-desktop-v-local}" | sha256sum | cut -c1-32)
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={}
          DSH_DESKTOP_WINDOWS_CER_FILE=
          DSH_DESKTOP_WINDOWS_SIGNTOOL=
          DSH_DESKTOP_WINDOWS_KEY_CONTAINER=
          DSH_DESKTOP_WINDOWS_TOKEN_PIN=
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          EOF
          cat apps/desktop/.env.windows
      - name: Build repository artifacts
        run: corepack pnpm run build:artifacts
      - name: Package desktop installer (unsigned canary, plugin included)
        run: corepack pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.script }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' \) -print -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ymzz-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Attach installers to the prerelease
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "湛箴_ymzz $TAG（桌面 canary，未验收）" \
                 --notes "CI 自动构建的未签名/未公证安装包，未通过功能、安全或合规验收。Windows SmartScreen / macOS Gatekeeper 提示未知发布者属预期。插件已随包体装载；问题反馈请附日志文件。"
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
