name: ymzz official site
on:
  push:
    branches: [master]
    paths:
      - "ymzz/site/**"
      - ".github/workflows/ymzz-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ymzz-official-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only site resources and honest download labels
        run: node ymzz/scripts/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ymzz/site
      - id: d
        uses: actions/deploy-pages@v4
