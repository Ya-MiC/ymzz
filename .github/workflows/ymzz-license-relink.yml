name: ymzz native LGPL source relink qualification (no binary publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ymzz-license-relink
  cancel-in-progress: false
jobs:
  source-relink:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install explicitly pinned build-only tooling, not product dependencies
        run: python -m pip install setuptools==84.2.1
      - name: Native source rebuild, modified library relink and real lxml validation
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs=& $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$vs){throw 'Supported preinstalled Visual Studio2022 x64 toolchain missing'}
          $vars=cmd /c "call `"$vs/VC/Auxiliary/Build/vcvars64.bat`" >nul && set"
          foreach($line in $vars){if($line -match '^([^=]+)=(.*)$'){[Environment]::SetEnvironmentVariable($matches[1],$matches[2],'Process')}}
          python ymzz/scripts/qualify-iconv-relink.py --work "$env:RUNNER_TEMP/ymzz LGPL source 中文 space" --output ymzz/docs/evidence/iconv-native-relink.json
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Preserve measured JSON ONLY, never test EXE/DLL or an unqualified installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ymzz-native-source-relink-${{ github.sha }}
          path: ymzz/docs/evidence/iconv-native-relink.json
          if-no-files-found: warn
