name: ymzz account security
on:
  push:
    branches: [master]
    paths: ['ymzz/auth/**', 'ymzz/site/**', '.github/workflows/ymzz-auth.yml']
  pull_request:
    paths: ['ymzz/auth/**', 'ymzz/site/**', '.github/workflows/ymzz-auth.yml']
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: ymzz/auth/package-lock.json
      - run: npm ci --prefix ymzz/auth --ignore-scripts
      - run: npm --prefix ymzz/auth run build
      - run: npm --prefix ymzz/auth test
      - run: node ymzz/scripts/check-site.mjs
