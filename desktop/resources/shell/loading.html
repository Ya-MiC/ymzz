<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>湛箴_ymzz</title>
    <style>
      /* Standalone start page shown while the bundled local service starts up.
         Uses system fonts only; no network requests, no scripts. */
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif;
        color: #3d3833;
        background: #f5f1ea;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #d8d2c6; background: #211d1a; }
      }
      main { text-align: center; max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
      p { margin: .25rem 0; line-height: 1.6; opacity: .8; }
      .dot { display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: .2s; }
      .dot:nth-child(3) { animation-delay: .4s; }
      @keyframes pulse { 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>湛箴_ymzz 正在启动</h1>
      <p>正在启动本地 DeepSeek Harness 服务，请稍候<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
      <p>启动完成后本页面会自动跳转到本地服务界面。</p>
    </main>
  </body>
</html>
